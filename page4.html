<html>
<head>
  <title>Application</title>
  <link rel="stylesheet" href="Page4.css">
  <link rel="stylesheet" href="AllPages.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <header>
    <div class="left">
      <img src="Logo.png" alt="Janus Web logo" class="logo">
      <h1 class="page_title">Janus Web</h1>
    </div>
    <input type="checkbox" id="nav-toggle">
    <div class="right">
        <a href="index.HTML">Home</a>
        <a href="Page2.HTML">Our Staff</a>
        <a href="Page3.html">Qualifications</a>
        <a href="page4.html" class="active">Application</a>
        <a href="page5.html">Day in our life</a>
        <a href="page6.html">Courses</a>
    </div>
    <label class="hamburger" for="nav-toggle">
        <span class="sr-only">Open menu</span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
    </label>
  </header>
  <div class="rp">
    <h1>Application Form</h1>
</div>

<form>
    <div class="form-group">
        <label for="job">Position Applying For</label>
        <select id="job" name="job" required>
            <option value="">Select a position...</option>
            <option value="TWD">Trainee Web Developer</option>
            <option value="TCSC">Trainee Cyber Security Consultant</option>
            <option value="TFED">Trainee Front End Developer</option>
        </select>
    </div>

    <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required>
    </div>

    <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="07123456789" pattern="[0-9]{11}" required>
    </div>

    <div class="form-group">
        <label for="address">Address Line 1</label>
        <input type="text" id="address" name="address" required>
    </div>

    <div class="form-group">
        <label for="postcode">Postcode</label>
        <input type="text" id="postcode" name="postcode" required>
    </div>

    <div class="form-group">
        <label for="quali">Qualifications</label>
        <textarea id="quali" name="quali" rows="4" required></textarea>
    </div>

    <div class="form-group">
        <label for="why">Why do you want to work for Janus Web?</label>
        <textarea id="why" name="why" rows="5" required></textarea>
    </div>

    <div class="form-group">
        <label for="myFile">Upload CV</label>
        <input type="file" id="myFile" name="filename">
    </div>

    <input type="submit" value="Submit Application" class="submit-btn">
</form>
</body>
</html>
